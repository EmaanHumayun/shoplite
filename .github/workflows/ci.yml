name: ShopLite Continuous Integration

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Frontend CI (Lint, Typecheck & Production Build)
  # ============================================================================
  frontend-ci:
    name: Frontend (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate Production Build
        run: npm run build
        working-directory: frontend

  # ============================================================================
  # Job 2: Catalog Service CI (Unit & Integration Tests)
  # ============================================================================
  catalog-service-ci:
    name: Catalog Service (Test Suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: catalog-service/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: catalog-service

      - name: Run Catalog Service Tests
        run: npm test
        working-directory: catalog-service

  # ============================================================================
  # Job 3: Inventory Service CI (Go Tests - Conditional on Source)
  # ============================================================================
  inventory-service-ci:
    name: Inventory Service (Go Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        if: hashFiles('inventory-service/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: inventory-service/go.sum

      - name: Test Inventory Service
        if: hashFiles('inventory-service/go.mod') != ''
        run: go test -v ./...
        working-directory: inventory-service

      - name: Skip Notice if Unimplemented
        if: hashFiles('inventory-service/go.mod') == ''
        run: echo "Inventory service source (go.mod) not yet committed. Skipping Go test stage."

  # ============================================================================
  # Job 4: Order Service CI (Java Spring Boot - Conditional on Source)
  # ============================================================================
  order-service-ci:
    name: Order Service (Java Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: hashFiles('order-service/pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Test Order Service
        if: hashFiles('order-service/pom.xml') != ''
        run: ./mvnw clean test
        working-directory: order-service

      - name: Skip Notice if Unimplemented
        if: hashFiles('order-service/pom.xml') == ''
        run: echo "Order service source (pom.xml) not yet committed. Skipping Java test stage."

  # ============================================================================
  # Job 5: Dockerfile Syntax & Build Validation
  # ============================================================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, catalog-service-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Catalog Service Dockerfile
        run: |
          if [ -s "catalog-service/Dockerfile" ]; then
            echo "Validating Catalog Service Dockerfile..."
            docker build --check catalog-service/ || docker build -t shoplite-catalog-test:ci catalog-service/
          fi

      - name: Validate Frontend Dockerfile
        run: |
          if [ -s "frontend/Dockerfile" ]; then
            echo "Validating Frontend Dockerfile..."
            docker build --check frontend/ || docker build -t shoplite-frontend-test:ci frontend/
          else
            echo "Frontend Dockerfile is empty or pending. Skipping build check."
          fi

  # ============================================================================
  # Job 6: Security Scan (Trivy Vulnerability Scanner)
  # ============================================================================
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [docker-validation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Repo Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
